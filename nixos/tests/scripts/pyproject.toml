[project]
name = "loom-tests"
version = "0.1.0"
description = "The appliance's VM tests, as a package the NixOS test driver imports"
requires-python = ">=3.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "loom_tests" }]
