[project]
name = "loom-tests"
version = "0.1.0"
description = "The appliance's VM tests, as a package the NixOS test driver imports"
requires-python = ">=3.11"
# As every first-party package declares it: without this the generated
# attribution records the package as UNKNOWN.
license = "MIT"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "loom_tests" }]
