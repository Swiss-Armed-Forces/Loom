[project]
name = "loom-usb-ingest"
version = "0.1.0"
description = "Mount USB media read-only on the Loom appliance and ingest it"
requires-python = ">=3.11"
# As every first-party package declares it: without this the generated
# attribution records the package as UNKNOWN.
license = "MIT"
# The console pane the copy is drawn in (loom_usb_ingest/watch.py).
dependencies = ["rich>=13"]

[project.scripts]
loom-usb-ingest = "loom_usb_ingest.__main__:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "loom_usb_ingest" }]
