[project]
name = "loom-installer"
version = "0.1.0"
description = "The Loom appliance installer: the USB stick's console menu, install and wipe"
requires-python = ">=3.11"
dependencies = ["rich>=13"]

[project.scripts]
loom-install = "loom_installer.install:main"
loom-menu = "loom_installer.menu:main"
loom-wipe = "loom_installer.wipe:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "loom_installer" }]
