# Disable AI Services
#
# Use this when you are not working on AI-related functionality
# (summarization, translation, embeddings) and want to skip deploying
# those services to speed up startup and reduce resource usage.
#
# Pass --disable-ai to up.sh to apply this file automatically.
#
# NOT for pointing Loom at an external inference endpoint: the skips below mean
# nothing is ever embedded, so RAG retrieves from an empty set with no error. Use
# ollama.enabled: false alone -- see Documentation/external-services.md.
#
ollama:
  enabled: false

# Embedding defaults to on, so without this every indexed file would retry
# against an Ollama that is not there until it lands in the graveyard queue.
# Auto-tagging is chained inside the embedding task, but is named explicitly so
# the coupling is not relied on. Translate, summarize and image description
# already default to skipped.
#
# OCR language detection is on by default too, and it heads the tika chain: it
# retries on a transient failure, a refused connection is one, and the budget is
# TIKA_MAX_RETRIES with exponential backoff -- so without this every image and
# PDF waits out that budget before being OCR'd with tika_ocr_languages alone,
# which is what it would have been OCR'd with anyway.
#
# The other decision models are left on. index_prioritization runs in the
# crawler, which asks once per intake object, catches the failure and dispatches
# at the default priority; translation_language_detection sits behind
# skip_translate_while_indexing, which already defaults to true; rag_rerank runs
# in the chatbot rather than while indexing.
pipeline:
  skip_embedding_while_indexing: true
  skip_auto_tag_file_while_indexing: true
  skip_ocr_language_detection_while_indexing: true
