{{- define "app.ollama.deployment" -}}
{{- $component := .component -}}
{{- $values := index .Values $component -}}
{{- if $values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}-{{ $component }}
  labels:
    {{- include "app.labels.custom" (dict "context" . "component" $component) | nindent 4 }}
    app.kubernetes.io/component: "{{ $component }}"
  {{- with include "app.annotations.custom" (dict "context" . "component" $component) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- if not $values.hpa.enabled }}
  replicas: {{ $values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $values.strategy.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $values.strategy.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app: {{ include "app.name" . }}-{{ $component }}
  template:
    metadata:
      labels:
        app: {{ include "app.name" . }}-{{ $component }}
        {{- include "app.labels.custom" (dict "context" . "component" $component) | nindent 8 }}
      {{- with include "app.annotations.custom" (dict "context" . "component" $component) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with $values.priorityClass }}
      priorityClassName: {{ include "app.fullname" $ }}-{{ . }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $component }}
          {{- if $values.runtimeImage.repository }}
          image: {{ .Values.image.registry }}/{{ $values.runtimeImage.repository }}:{{ $values.runtimeImage.tag | default .Chart.AppVersion | default .Values.image.tag }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ $values.image.repository }}:{{ $values.image.tag | default .Chart.AppVersion }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ $component }}
              containerPort: {{ $values.service.port }}
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:{{ $values.service.port }}"
            - name: OLLAMA_MODELS
              value: /ollama-models
          startupProbe:
            httpGet:
              path: /api/ps
              port: {{ $values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 80
          {{- if $values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /api/ps
              port: {{ $values.service.port }}
            initialDelaySeconds: {{ default 0 $values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 20 $values.readinessProbe.periodSeconds }}
            failureThreshold: {{ default 3 $values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if $values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /api/ps
              port: {{ $values.service.port }}
            initialDelaySeconds: {{ default 0 $values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ default 20 $values.livenessProbe.periodSeconds }}
            failureThreshold: {{ default 6 $values.livenessProbe.failureThreshold }}
          {{- end }}
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
            {{- with include "app.trustedCerts.volumeMount" . }}{{ . | nindent 12 }}{{- end }}
          {{- if $values.resources }}
          resources: {{- toYaml $values.resources | nindent 12 }}
          {{- end }}
      initContainers:
        - name: copy-ollama-models
          {{- if $values.modelsImage.repository }}
          image: {{ .Values.image.registry }}/{{ $values.modelsImage.repository }}:{{ $values.modelsImage.tag | default .Chart.AppVersion }}
          {{- else }}
          image: {{ .Values.image.registry }}/{{ $values.image.repository }}:{{ $values.image.tag | default .Chart.AppVersion }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Copying preloaded models to model storage..."
              cp --recursive --update /root/.ollama/models/* /ollama-models/ || true
          volumeMounts:
            - name: ollama-models
              mountPath: /ollama-models
          {{- if $values.initContainer.resources }}
          resources: {{- toYaml $values.initContainer.resources | nindent 12 }}
          {{- end }}
        {{- with include "app.trustedCerts.initContainer" . }}{{ . | nindent 8 }}{{- end }}
      volumes:
        - name: ollama-models
          {{- if $values.pvc.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "app.fullname" . }}-{{ $component }}-ollama-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with include "app.trustedCerts.volumes" . }}{{ . | nindent 8 }}{{- end }}
{{- end }}
{{- end -}}
