{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "app.fullname" . }}-certificate
  labels:
    {{- include "app.labels.custom" (dict "context" . "component" "") | nindent 4 }}
  {{- with include "app.annotations.custom" (dict "context" . "component" "") }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  # name of the secret where the private key, certificate and CA will be stored
  secretName: {{ include "app.fullname" . }}-certificate
  # CommonName is mandatory
  commonName: {{ .Values.domain }}
  # Optional additional dnsNames.
  #
  # Built from .Values.hostnames, the same source the pre-install Job's
  # --hostname arguments come from: every Ingress points tls.secretName at the
  # secret this Certificate produces, so on the cert-manager path this is the
  # serving certificate and a host missing here is a host nothing can verify.
  dnsNames:
    {{- range concat (.Values.hostnames.ingress | default list) (.Values.hostnames.extra | default list) | sortAlpha | uniq }}
    - {{ printf "%s.%s" . $.Values.domain | quote }}
    {{- end }}
  # Mandatory issuerRef to get a PKI signed certificate
  issuerRef:
    name: {{ default (printf "%s-selfsigned-issuer" (include "app.fullname" .)) .Values.certificate.issuerRef.name }}
    kind: ClusterIssuer
  # Optional privateKey size, enforced to be 4096 bits anyway
  privateKey:
    size: 4096
{{- end }}
