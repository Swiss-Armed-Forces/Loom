apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-pre-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels.custom" (dict "context" . "component" "preInstall") | nindent 4 }}
    app.kubernetes.io/component: pre-install
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-5"
    {{- include "app.annotations.custom" (dict "context" . "component" "preInstall") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # `patch` as well as `create`, because the certificate scripts replace a Secret
    # with `kubectl apply`, and apply against an *existing* object is a PATCH.
    # `generate-secret.sh` does delete-then-create and needs only the other three,
    # which is why this list went unnoticed: a fresh install never patches, so only
    # an upgrade of a deployment that already holds `self-signed-cert` -- i.e. every
    # existing cluster, the moment a hostname is added to the certificate -- failed
    # the pre-upgrade hook and stopped the release.
    verbs: ["get", "create", "patch", "delete"]
