apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "app.fullname" . }}-pre-install
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels.custom" (dict "context" . "component" "preInstall") | nindent 4 }}
    app.kubernetes.io/component: pre-install
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-5"
    {{- include "app.annotations.custom" (dict "context" . "component" "preInstall") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # `patch` as well as `create`, because the certificate scripts replace a Secret
    # with `kubectl apply`, and apply against an *existing* object is a PATCH.
    # `generate-secret.sh` does delete-then-create and needs only the other three.
    # Only an upgrade patches: a fresh install has no Secret to apply against.
    verbs: ["get", "create", "patch", "delete"]
