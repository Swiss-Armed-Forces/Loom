apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" $ }}-generate-self-signed-certificate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "app.name" $ }}-generate-self-signed-certificate
    spec:
      serviceAccountName: {{ include "app.fullname" $ }}-pre-install
      restartPolicy: Never
      containers:
        - name: create-secret
          image: {{ .Values.image.registry }}/{{ .Values.preInstall.image.repository }}:{{ default (default .Chart.AppVersion .Values.image.tag) .Values.preInstall.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - /opt/loom/scripts/generate-self-signed-certificate.sh
          args:
            - --namespace
            - {{ .Release.Namespace | quote }}
            - --domain
            - {{ .Values.domain | quote }}
            # Every name the certificate has to carry, from .Values.hostnames --
            # see the comment there for why a wildcard cannot do this job.
            #
            # `default list` on each half: nulling a key is the only way Helm
            # lets an operator drop list entries rather than merge them, and
            # `concat` panics on a nil with a Go trace that names no value.
            {{- $hostnames := concat (.Values.hostnames.ingress | default list) (.Values.hostnames.extra | default list) | sortAlpha | uniq }}
            {{- if not $hostnames }}
            {{- fail "hostnames.ingress and hostnames.extra are both empty: the certificate would name no host. See the comment on `hostnames` in values.yaml." }}
            {{- end }}
            {{- range $hostnames }}
            - --hostname
            - {{ . | quote }}
            {{- end }}
          volumeMounts:
            - name: scripts
              mountPath: /opt/loom/scripts
              readOnly: true
          {{- if .Values.preInstall.resources }}
          resources: {{- toYaml .Values.preInstall.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "app.fullname" $ }}-pre-install-scripts
            defaultMode: 0555
