apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" $ }}-generate-self-signed-certificate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "app.name" $ }}-generate-self-signed-certificate
    spec:
      serviceAccountName: {{ include "app.fullname" $ }}-pre-install
      restartPolicy: Never
      containers:
        - name: create-secret
          image: {{ .Values.image.registry }}/{{ .Values.preInstall.image.repository }}:{{ default (default .Chart.AppVersion .Values.image.tag) .Values.preInstall.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail

              #
              # Vars
              #
              export NAMESPACE="{{ .Release.Namespace }}"
              export LOOM_DOMAIN="{{ .Values.domain }}"
              export CERT_SECRET_NAME="self-signed-cert"

              CRT_FILE="$(mktemp)"
              KEY_FILE="$(mktemp)"

              #
              # Functions
              #

              create_self_signed_cert() {
                  if kubectl get secret "${CERT_SECRET_NAME}" -n "${NAMESPACE}" &>/dev/null; then
                      # Keep it only if it carries a subjectAltName. Certificates
                      # minted before that extension was added are CN-only, and a
                      # CN-only certificate is rejected outright by every modern
                      # TLS client (see the openssl call below). Without this the
                      # guard above would preserve the broken certificate for the
                      # life of the cluster and the fix would never take effect on
                      # anything but a fresh deployment.
                      #
                      # Grepping the output rather than checking the exit status:
                      # `openssl x509 -ext` exits 0 whether or not the extension
                      # is there, printing "No extensions in certificate" when it
                      # is not.
                      if kubectl get secret "${CERT_SECRET_NAME}" -n "${NAMESPACE}" \
                          -o jsonpath='{.data.tls\.crt}' \
                          | base64 --decode \
                          | openssl x509 -noout -ext subjectAltName 2>/dev/null \
                          | grep -q "Subject Alternative Name"; then
                          echo "[-] Certificate '${CERT_SECRET_NAME}' already exists in namespace"
                          return
                      fi

                      echo "[*] Certificate '${CERT_SECRET_NAME}' has no subjectAltName; regenerating"
                      kubectl delete secret "${CERT_SECRET_NAME}" -n "${NAMESPACE}"
                  fi

                  local common_name
                  common_name="*.${LOOM_DOMAIN}"

                  # Generate self-signed cert and key.
                  #
                  # -addext is not decoration. RFC 6125 deprecated matching the
                  # hostname against CN, and every modern TLS client now ignores
                  # CN outright when no subjectAltName is present: Chrome since
                  # 58, Go, and Node/Bun, which fails with
                  # ERR_TLS_CERT_ALTNAME_INVALID even when this certificate is
                  # explicitly trusted. Browsers hide that behind a warning a
                  # human can click through; a programmatic client cannot, so
                  # without this line nothing can speak HTTPS to *.loom -- which
                  # is how the appliance's console assistant reaches ollama.loom.
                  #
                  # The bare domain is listed alongside the wildcard because a
                  # wildcard matches exactly one label: "*.loom" covers
                  # "ollama.loom" but not "loom" itself.
                  openssl req -x509 -nodes -days 365 \
                      -newkey rsa:4096 \
                      -keyout "${KEY_FILE}" \
                      -out "${CRT_FILE}" \
                      -subj "/CN=${common_name}/O=Wildcard Self-Signed" \
                      -addext "subjectAltName=DNS:${common_name},DNS:${LOOM_DOMAIN}"

                  # Create the Kubernetes TLS secret
                  kubectl create secret tls "${CERT_SECRET_NAME}" \
                      --cert="${CRT_FILE}" \
                      --key="${KEY_FILE}" \
                      --namespace="${NAMESPACE}"
              }

              #
              # Atexit
              #
              atexit(){
                  rm -f \
                      "${CRT_FILE}" \
                      "${KEY_FILE}"
              }
              trap atexit EXIT

              #
              # Main
              #
              create_self_signed_cert
          {{- if .Values.preInstall.resources }}
          resources: {{- toYaml .Values.preInstall.resources | nindent 12 }}
          {{- end }}
