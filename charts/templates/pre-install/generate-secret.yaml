{{- range .Values.preInstall.generateSecret }}
{{- if not (and (eq .name "archive-enc-master-key") $.Values.externalSecrets.archiveEncMasterKey.enabled) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" $ }}-gen-sec-{{ .name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        app: {{ include "app.name" $ }}-gen-sec-{{ .name }}
    spec:
      serviceAccountName: {{ include "app.fullname" $ }}-pre-install
      restartPolicy: Never
      containers:
        - name: create-secret
          image: {{ $.Values.image.registry }}/{{ $.Values.preInstall.image.repository }}:{{ default (default $.Chart.AppVersion $.Values.image.tag) $.Values.preInstall.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - bash
            - /opt/loom/scripts/generate-secret.sh
          args:
            - --namespace
            - {{ $.Release.Namespace | quote }}
            - --environment
            - {{ $.Values.environment | quote }}
            - --name
            - {{ .name | quote }}
            # `default ""` before `quote`: sprig's quote skips a nil input
            # instead of returning `""`, and the null element that leaves in
            # args is rejected by the API server as a non-string.
            - --size
            - {{ .size | default "" | quote }}
            - --chars
            - {{ .chars | default "" | quote }}
            - --fixed
            - {{ .fixed | default "" | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /opt/loom/scripts
              readOnly: true
          {{- if $.Values.preInstall.resources }}
          resources: {{- toYaml $.Values.preInstall.resources | nindent 12 }}
          {{- end }}
      volumes:
        - name: scripts
          configMap:
            name: {{ include "app.fullname" $ }}-pre-install-scripts
            defaultMode: 0555
{{- end }}
{{- end }}
