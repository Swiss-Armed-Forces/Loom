# NVIDIA GPU Deployment
#
# Use this when your nodes have NVIDIA GPUs available and you want faster AI
# inference and translation. Without this, all AI workloads run on CPU only.
#
# For single-node deployments, pass --gpus nvidia to up.sh instead of applying
# this file manually.
#
# ollama.runtimeImage.repository is deliberately not set here: values.yaml
# already defaults it to ollama-runtime-nvidia, so an override would be a no-op.
# The AMD counterpart (values-amd-gpu.yaml) does have to override it.
#
ollama:
  resources:
    requests:
      nvidia.com/gpu: 1
    limits:
      nvidia.com/gpu: 1
