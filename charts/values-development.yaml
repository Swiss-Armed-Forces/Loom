# Development Mode
#
# Use this when actively developing Loom locally. It trades model quality and
# production-like behaviour for fast iteration: lightweight models reduce resource
# usage, hot reload means code changes take effect without pod restarts, and all
# internal services are reachable via ingress for direct inspection and debugging.
#
# Not suitable for production use.
#
# Plain http is not here: up.sh adds charts/values-http.yaml wherever it selects
# the dev profile, so this file on its own still renders the https redirect.
#
environment: development

# `qwen2.5:0.5b` carries no thinking capability, and Ollama rejects a request that asks
# one to reason: `reasoning_effort` above `none` becomes a native `think`, and the chat
# handler answers `400 "<model>" does not support thinking` rather than ignoring it. So
# every client whose `LLMClientSettings` subclass defaults `thinking` to `true` -- agent,
# summarization, summarization_refine, rag_synthesize -- has to turn it off here to match
# the model this profile swaps in. The other clients already default to `false`.
llm:
  embedding:
    text_chunk_size: 250
    text_chunk_overlap: 25

  suggest_queries:
    model: qwen2.5:0.5b

  agent:
    model: qwen2.5:0.5b
    thinking: false

  summarization_key_points:
    model: qwen2.5:0.5b
    text_chunk_size: 1000
    text_chunk_overlap: 33

  summarization:
    model: qwen2.5:0.5b
    thinking: false

  summarization_refine:
    model: qwen2.5:0.5b
    thinking: false

  rag_hyde:
    model: qwen2.5:0.5b
    num_documents: 1

  rag_rerank:
    model: qwen2.5:0.5b
    temperature: 0

  rag_synthesize:
    model: qwen2.5:0.5b
    thinking: false

  translation:
    model: qwen2.5:0.5b

  vision:
    model: moondream:1.8b

api:
  # yamllint disable rule:indentation
  command: [
    "python", "-Xfrozen_modules=off",
    "-m", "debugpy",
      "--listen", "127.0.0.1:4401",
    "-m", "uvicorn", "main:app",
      "--workers", "1",
      "--log-level", "debug",
      "--port", "8084",
      "--host", "0.0.0.0",
      "--reload",
      "--reload-dir", "/code/common",
      "--reload-dir", "/code/api"
  ]
  # yamllint enable rule:indentation

frontend:
  # The dev-Server needs a bit more resources
  resources:
    requests:
      cpu: "0.1"
      memory: "1Gi"
    limits:
      cpu: "0.5"
      memory: "2Gi"

worker:
  # yamllint disable rule:indentation
  command: [
    "python", "-Xfrozen_modules=off",
    "-m", "debugpy",
      "--listen", "127.0.0.1:5500",
    "-m", "watchdog.watchmedo",
      "auto-restart",
      "--verbose",
      "--recursive",
      "--signal", "SIGTERM",
      "--patterns", "*.py",
      "--directory", "/code/common",
      "--directory", "/code/worker",
      "--debounce-interval", "3",
    "--",
    "python", "-Xfrozen_modules=off",
    "main.py",
      "worker",
      "--loglevel", "DEBUG"
  ]
  # yamllint enable rule:indentation

