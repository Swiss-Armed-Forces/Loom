elasticsearch:
  resources:
    requests:
      cpu: "0.5"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

rabbit:
  ingress:
    amqp:
      enabled: true

ollama:
  pvc:
    enabled: false

dovecot:
  ingress:
    imap:
      enabled: true

redis: &redis
  ingress:
    enabled: true

redis-cache: *redis
