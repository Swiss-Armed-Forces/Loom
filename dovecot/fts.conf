# spellchecker:ignore-file
# Replaces the fts.conf shipped in the Dovecot image, which turns the full text
# search plugins on.
#
# With them enabled, SEARCH is answered from the search index instead of the
# message itself, and the generic tokenizer caps terms at
# language_tokenizer_generic_token_maxlen (30). Any header value longer than 49
# characters then never matches - including the 64 hex character
# X-Deduplication-Upload-Hash that IMAPService.get_uid_of_email looks up.
#
# Loom indexes mail content in Elasticsearch, so Dovecot's own index is not
# needed. Files in conf.d are read in alphabetical order and this one has to
# keep the upstream name to override it rather than be overridden by it.
mail_plugins {
  fts = no
  fts_flatcurve = no
}

# Without an index, `SEARCH HEADER X-Deduplication-Upload-Hash <sha256>` is
# evaluated against every message in the mailbox, and every ingested mail runs
# one. Caching the header keeps that scan inside the compact index cache instead
# of opening each message file - the IMAP folder mirrors the source directory,
# so a single archive directory can become a mailbox with 100k messages.
mail_cache_fields = hdr.x-deduplication-upload-hash
mail_always_cache_fields = hdr.x-deduplication-upload-hash
