# spellchecker:ignore-file
# Pins the mail storage layout to what the Dovecot 2.3 image used, so a PVC
# written by an earlier Loom deployment stays readable after the 2.4 bump.
#
# The 2.3 image stored mail as `sdbox:~/Mail` with the `fs` mailbox list layout
# and mailbox names encoded as mUTF-7 on disk. The 2.4 image's top level
# dovecot.conf defaults to maildir at `~/mail` with `mailbox_list_layout = index`
# and `mailbox_list_utf8 = yes` instead. Taking those defaults makes Dovecot look
# at a path that does not exist, so it creates an empty `mail` directory next to
# the existing `Mail` one and serves an empty mailbox - the old mail is not lost,
# just never looked at, and nothing logs a warning about it.
#
# `mailbox_list_utf8` matters because Loom derives IMAP folder names from file
# paths: a path part such as `Zürich` is stored as the directory `Z&APw-rich`,
# and reading that tree as UTF-8 yields a different folder name.
#
# conf.d is included at the end of the image's dovecot.conf, so these override
# the defaults set there.
mail_driver = sdbox
mail_path = ~/Mail
mailbox_list_layout = fs
mailbox_list_utf8 = no
