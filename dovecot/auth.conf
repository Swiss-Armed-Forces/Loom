# spellchecker:ignore-file
# Replaces the auth.conf shipped in the Dovecot image. Loom trusts every user
# (see README.md), so authentication is a static passdb that accepts any
# username with the password Loom's settings.imap_password carries.
#
# import_environment and doveadm_password are carried over verbatim from the
# image's own auth.conf: dropping them leaves the doveadm HTTP endpoint on :8080
# without a credential source.
import_environment {
  DOVEADM_PASSWORD = %{env:DOVEADM_PASSWORD | default}
  USER_PASSWORD = %{env:USER_PASSWORD | default('{CRYPT}*')}
}

doveadm_password = $ENV:DOVEADM_PASSWORD

auth_mechanisms = plain login
auth_allow_cleartext = yes
passdb static {
  password = {SHA512-CRYPT}$6$QyUXCNr.cHYUFoIO$mc142xNtIOCdgqYPmgP8zv648Ywa1Yjh8QluvvjCcqseT0PhbdVBzcVQB7DtxPY2ja/AwrfLS/hZFXWBDfrqN0
}
userdb static {
}
