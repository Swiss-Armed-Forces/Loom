# mypy configuration for the scripts at the root of cicd/.
#
# The hooks run each tool from the directory of the python root it belongs to
# (see cicd/run_hook_tool.sh), and mypy reads its configuration from the
# directory it runs in, so this file is what applies to those scripts. The
# other roots carry theirs in their own pyproject.toml, cicd/aitools included.

[mypy]

#
# Modules with missing type stubs
#

[mypy-gitlab.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
