[tool.poetry]
name = "aitools"
version = "0.1.0"
description = "Loom AI developer tools"
authors = []
license = "MIT"
packages = [
    { include = "aitools", from = ".." },
]

[tool.poetry.dependencies]
python = "~3.14"
gitpython = "^3.1.44"
python-gitlab = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# This file anchors pytest's rootdir here, so the repo-root pytest.ini never applies.
# Mirror its settings: do not use /tmp (RAMFS) as tmp directory because we don't want
# that our tmp artifacts end up in RAM.
addopts = '--basetemp=".pytest_tmp" --random-order'
timeout = 900

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

#
# Modules with missing type stubs
#

[[tool.mypy.overrides]]
module = "gitlab.*"
ignore_missing_imports = true
