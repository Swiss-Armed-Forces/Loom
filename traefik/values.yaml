image:
  registry: registry.gitlab.com
  repository: swiss-armed-forces/cyber-command/cea/loom/traefik

# expose traefik ui
#
# `websecure` alone, like every route the Loom chart renders. Port 80 carries
# nothing but that chart's global http-to-https redirect, which matches
# `*.<domain>` and so covers this host too. TLS is terminated without a `tls:`
# section here because the chart sets `--entryPoints.websecure.http.tls=true`
# and tls-store.yaml makes `self-signed-cert` the default certificate.
#
# This route is outside the chart cicd/check_https_only.sh renders, so that
# script reads the entrypoints below directly.
ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - websecure
    matchRule: Host("traefik.loom")

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

logs:
  access:
    enabled: true
    addInternals: true

# Every entrypoint below binds a hostPort on a single-node cluster, so the
# chart's default RollingUpdate (maxSurge 1, maxUnavailable 0) cannot complete:
# the surge pod stays Pending on ports the outgoing pod still holds, and
# maxUnavailable 0 means the outgoing pod is never terminated. Recreate costs a
# few seconds of ingress during an upgrade; the alternative is deleting the
# release on every bring-up.
updateStrategy:
  type: Recreate

ports:
  web:
    hostPort: 80
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  websecure:
    hostPort: 443
    transport:
      respondingTimeouts:
        readTimeout: "0s"
  imap:
    port: 31143
    hostPort: 31143
  amqp:
    port: 5672
    hostPort: 5672
  redis:
    hostPort: 6379
    port: 6379
  redis-cache:
    hostPort: 6380
    port: 6380
  prometheus:
    hostPort: 9090
    port: 9090

additionalArguments:
  - "--entrypoints.imap.address=:31143"
  - "--entrypoints.amqp.address=:5672"
  - "--entrypoints.redis.address=:6379"
  - "--entrypoints.redis-cache.address=:6380"
  - "--entrypoints.prometheus.address=:9090"
  - "--api.insecure=true"
